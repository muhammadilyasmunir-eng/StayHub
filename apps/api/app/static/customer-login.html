<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StayHub Guest Login</title><style>body{margin:0;font-family:Inter,Arial,sans-serif;background:#f5f7fb;color:#172033}.wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(460px,100%);background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:34px;box-shadow:0 18px 55px rgba(15,23,42,.08)}.brand{font-size:25px;font-weight:850;color:#1d4ed8}.muted{color:#667085;font-size:14px;line-height:1.6}.label{display:block;font-size:12px;font-weight:750;margin:20px 0 7px}input{width:100%;box-sizing:border-box;border:1px solid #d5dae3;border-radius:10px;padding:13px 14px;font-size:15px;outline:none}input:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.1)}button{width:100%;margin-top:14px;border:0;border-radius:10px;padding:13px;background:#2563eb;color:#fff;font-weight:800;cursor:pointer}button.secondary{background:#eef2f7;color:#172033}.msg{margin-top:14px;font-size:13px;min-height:20px}.hidden{display:none}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.back{color:#2563eb;text-decoration:none;font-size:13px;font-weight:700}</style></head><body><div class="wrap"><div class="card"><div class="top"><div class="brand">StayHub</div><a class="back" href="/">Back to home</a></div><h1>Guest Login</h1><p class="muted">Sign in with the email address you used for your StayHub reservation. We will send a secure one-time verification code.</p><form id="sendForm"><label class="label">Reservation email</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com" required><button>Send verification code</button></form><form id="verifyForm" class="hidden"><label class="label">Verification code</label><input id="code" inputmode="numeric" maxlength="6" placeholder="6-digit code" required><button>Verify & continue</button><button type="button" class="secondary" id="change">Use a different email</button></form><div id="msg" class="msg"></div></div></div><script>const $=id=>document.getElementById(id),msg=t=>{$('msg').textContent=t};$('sendForm').onsubmit=async e=>{e.preventDefault();const email=$('email').value.trim();msg('Sending verification code…');try{const r=await fetch('/public/booking-otp/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})}),d=await r.json();if(!r.ok)throw Error(d.detail||'Unable to send code');$('sendForm').classList.add('hidden');$('verifyForm').classList.remove('hidden');msg(d.delivery==='development'?'Verification code generated. Check the StayHub API terminal for the 6-digit code.':'Verification code sent. Check your email.');$('code').focus()}catch(x){msg(x.message)}};$('verifyForm').onsubmit=async e=>{e.preventDefault();const email=$('email').value.trim(),code=$('code').value.trim();msg('Verifying…');try{const r=await fetch('/public/booking-otp/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,code})}),d=await r.json();if(!r.ok)throw Error(d.detail||'Verification failed');localStorage.setItem('stayhub_token',d.access_token);localStorage.setItem('stayhub_customer_email',email);location.href='/my-reservations'}catch(x){msg(x.message)}};$('change').onclick=()=>{$('verifyForm').classList.add('hidden');$('sendForm').classList.remove('hidden');$('code').value='';msg('')}};</script></body></html>
