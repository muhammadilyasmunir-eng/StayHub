<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StayHub Admin - Property Verification</title><link rel="stylesheet" href="/static/public/public.css"><style>body{background:#f6f8fb}.wrap{max-width:1250px;margin:30px auto;padding:0 18px 60px}.card{background:#fff;border-radius:14px;padding:22px;margin:15px 0;box-shadow:0 5px 22px rgba(0,0,0,.06)}.grid{display:grid;grid-template-columns:350px 1fr;gap:18px}.item{padding:14px;border:1px solid #e5e7eb;border-radius:10px;margin:8px 0;cursor:pointer}.item.active{border-color:#2563eb;background:#eff6ff}.btn{border:0;border-radius:8px;padding:10px 15px;font-weight:700;cursor:pointer;background:#2563eb;color:#fff}.danger{background:#dc2626}.muted{color:#6b7280}.row{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:8px 0;gap:20px}.thumb{width:120px;height:85px;object-fit:cover;margin:5px;border-radius:8px}.section{border-top:1px solid #eee;margin-top:18px;padding-top:15px}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#fef3c7;color:#92400e;font-weight:700}@media(max-width:850px){.grid{grid-template-columns:1fr}.row{flex-direction:column;gap:3px}}</style></head><body><div class="wrap"><h1>StayHub Admin — Property Verification</h1><p class="muted">Review the complete registration before approval. Only approved properties should become public.</p><div id="login" class="card"><h2>Admin Login</h2><input id="email" placeholder="Admin email" style="padding:11px;width:100%;box-sizing:border-box;margin:5px 0"><input id="password" type="password" placeholder="Password" style="padding:11px;width:100%;box-sizing:border-box;margin:5px 0"><button class="btn" onclick="login()">Login</button><p id="msg"></p></div><div id="app" style="display:none"><div class="grid"><div class="card"><h2>Pending Properties</h2><div id="list">Loading...</div></div><div class="card"><div id="detail">Select a property.</div></div></div></div></div><script>let token='',selected=null;const $=x=>document.getElementById(x);async function req(url,opt={}){opt.headers={...(opt.headers||{}),Authorization:'Bearer '+token};const r=await fetch(url,opt);const d=await r.json();if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:JSON.stringify(d.detail));return d}async function login(){const b=new URLSearchParams();b.append('username',$('email').value);b.append('password',$('password').value);b.append('grant_type','password');const r=await fetch('/users/login',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:b});const d=await r.json();if(!r.ok){$('msg').textContent=d.detail||'Login failed';return}token=d.access_token;$('login').style.display='none';$('app').style.display='block';load()}async function load(){try{const items=await req('/admin/hotels/pending');$('list').innerHTML=items.length?items.map(h=>`<div class="item ${selected===h.id?'active':''}" onclick="select(${h.id})"><b>${esc(h.name)}</b><br>${esc(h.city)}, ${esc(h.country)}<br><span class="muted">${esc(h.property_type)} · ${esc(h.status)}</span></div>`).join(''):'<p>No pending properties.</p>'}catch(e){$('list').textContent=e.message}}function block(title,body){return `<div class="section"><h3>${title}</h3>${body}</div>`}function rows(obj){return Object.entries(obj).map(([k,v])=>`<div class="row"><b>${esc(k.replaceAll('_',' '))}</b><span>${esc(v??'—')}</span></div>`).join('')}async function select(id){selected=id;load();try{const h=await req('/admin/hotels/'+id);let html=`<h2>${esc(h.name)}</h2><span class="badge">${esc(h.status)}</span>`;html+=block('Property',rows({type:h.property_type,star_rating:h.star_rating,address:h.address,city:h.city,country:h.country,postal_code:h.postal_code,phone:h.phone,alternate_phone:h.alternate_phone,website:h.website,total_rooms:h.total_rooms,check_in:h.check_in_time,check_out:h.check_out_time,latitude:h.latitude,longitude:h.longitude}));html+=block('Owner',rows({name:h.owner?.name,email:h.owner?.email,phone:h.owner?.phone,username:h.owner?.username}));html+=block('Description',`<p>${esc(h.description||'—')}</p>`);html+=block('Facilities',`<p>${(h.facilities||[]).map(x=>esc(x.name)).join(', ')||'—'}</p>`);html+=block('Policies',rows(h.policy||{}));html+=block('Hotel Photos',`<div>${(h.photos||[]).map(x=>`<img class="thumb" src="${esc(x.url)}" alt="${esc(x.caption||'Hotel photo')}">`).join('')||'—'}</div>`);html+=block('Verification Documents',(h.documents||[]).map(x=>`<div class="row"><span><b>${esc(x.type)}</b><br>License: ${esc(x.license_number||'—')} · Registration: ${esc(x.registration_number||'—')} · Document: ${esc(x.document_number||'—')}</span><a href="${esc(x.url)}" target="_blank">Open</a></div>`).join('')||'—');html+=block('Room Categories',(h.room_types||[]).map((r,i)=>`<div class="card"><h4>${i+1}. ${esc(r.name)}</h4>${rows({description:r.description,rooms:r.number_of_rooms,adults:r.max_adults,children:r.max_children,bed:r.bed_type,size:r.room_size,price:r.base_price,smoking:r.smoking_allowed,extra_bed:r.extra_bed_available,extra_bed_price:r.extra_bed_price,extra_bed_information:r.extra_bed_information})}<p><b>Facilities:</b> ${(r.facilities||[]).map(x=>esc(x.name)).join(', ')}</p><div>${(r.photos||[]).map(x=>`<img class="thumb" src="${esc(x.url)}" alt="${esc(x.caption||'Room photo')}">`).join('')}</div></div>`).join('')||'—');html+=`<div class="section"><button class="btn" onclick="approve()">Approve Property</button> <button class="btn danger" onclick="reject()">Reject</button></div>`;$('detail').innerHTML=html}catch(e){$('detail').textContent=e.message}}async function approve(){if(!selected)return;try{await req('/admin/hotels/'+selected+'/approve',{method:'POST'});selected=null;await load();$('detail').innerHTML='<p>Property approved successfully.</p>'}catch(e){alert(e.message)}}async function reject(){const reason=prompt('Rejection reason:');if(reason===null||!reason.trim())return;try{await req('/admin/hotels/'+selected+'/reject?reason='+encodeURIComponent(reason),{method:'POST'});selected=null;await load();$('detail').innerHTML='<p>Property rejected.</p>'}catch(e){alert(e.message)}}function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}</script></body></html>
